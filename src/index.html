<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piggy Bank</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --gold: #d97706;  --gold-light: #fef3c7;
      --blue: #2563eb;  --blue-light: #dbeafe;
      --green: #16a34a; --green-light: #dcfce7;
      --red: #dc2626;   --red-light: #fee2e2;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding: 14px 18px;
      background: var(--accent); border-radius: var(--radius); color: white;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 1px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-icon { background: rgba(255,255,255,.2); color: white; border: none; font-size: 1.1rem; padding: 6px 10px; border-radius: 8px; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-gold { background: var(--gold); color: white; }
    .btn-blue { background: var(--blue); color: white; }

    /* ── Member overview grid ────────────────────────────── */
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .member-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px; cursor: pointer;
      box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
    }
    .member-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(124,58,237,.1); }
    .member-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .member-card .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; color: white; flex-shrink: 0; }
    .member-card .name { font-weight: 700; font-size: 1rem; }
    .member-card .role { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .bank-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .bank-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; }
    .bank-pill.money       { background: var(--gold-light);  color: var(--gold); }
    .bank-pill.screen_time { background: var(--blue-light);  color: var(--blue); }
    .bank-pill.empty       { background: var(--border); color: var(--muted); font-weight: 500; }
    .member-card .hint { font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

    /* ── Member detail ───────────────────────────────────── */
    .back-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .back-bar h2 { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .back-bar .avatar-sm { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: white; }

    /* ── Bank card ───────────────────────────────────────── */
    .bank-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .bank-card-header { padding: 16px 18px 12px; }
    .bank-type-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
    .bank-balance { font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; margin-bottom: 4px; }
    .bank-balance.money       { color: var(--gold); }
    .bank-balance.screen_time { color: var(--blue); }
    .bank-admin-actions { display: flex; gap: 8px; padding: 0 18px 14px; }

    /* ── Savings goals ──────────────────────────────────── */
    .goal-list { padding: 0 18px 14px; display: grid; gap: 8px; }
    .goal-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); }
    .goal-top { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; font-weight: 700; margin-bottom: 6px; }
    .goal-meta { font-size: .76rem; color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; gap: 8px; }
    .goal-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .goal-fill { height: 100%; background: var(--green); border-radius: inherit; }
    .goal-actions { margin-top: 8px; display: flex; justify-content: flex-end; }

    /* ── Transactions ────────────────────────────────────── */
    .tx-list { border-top: 1px solid var(--border); }
    .tx-row { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border); }
    .tx-row:last-child { border-bottom: none; }
    .tx-amount { font-size: 0.95rem; font-weight: 700; min-width: 60px; text-align: right; flex-shrink: 0; }
    .tx-amount.positive { color: var(--green); }
    .tx-amount.negative { color: var(--red); }
    .tx-detail { flex: 1; min-width: 0; }
    .tx-note { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-note.muted { color: var(--muted); font-style: italic; }
    .tx-meta { font-size: 0.72rem; color: var(--muted); }
    .tx-source { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
    .tx-source.chores { background: var(--green-light); color: var(--green); }
    .tx-source.automation { background: var(--green-light); color: var(--green); }
    .tx-source.manual { background: var(--border); color: var(--muted); }

    /* ── Create bank row ─────────────────────────────────── */
    .create-bank-row {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 16px; text-align: center; margin-bottom: 16px;
      color: var(--muted); font-size: 0.9rem;
    }
    .create-bank-row button { margin-top: 10px; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    @media (min-width: 480px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal { background: white; border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 480px; padding: 22px; max-height: 90vh; overflow-y: auto; }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
      font-size: 0.95rem; outline: none; transition: border-color .15s; background: white; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .input-prefix { position: relative; }
    .input-prefix .prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
    .input-prefix input { padding-left: 24px; }
    .amount-hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }

    .type-selector { display: flex; gap: 10px; }
    .type-opt { flex: 1; padding: 12px; border-radius: 8px; border: 1.5px solid var(--border); cursor: pointer; text-align: center; transition: all .12s; }
    .type-opt:hover { border-color: var(--accent); }
    .type-opt.selected { border-color: var(--accent); background: var(--accent-light); }
    .type-opt .type-icon { font-size: 1.5rem; margin-bottom: 4px; }
    .type-opt .type-label { font-size: 0.82rem; font-weight: 600; }

    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .processing-badge { font-size: 0.75rem; color: var(--accent); background: var(--accent-light); border-radius: 4px; padding: 2px 8px; margin-left: 8px; }
    .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
  </style>
  <base href="/run/piggy-bank/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm } from "/hub-sdk.js";
import { fmtMoney, fmtTime, fmtBalance, fmtAmount, fmtDate, goalProgress, remainingForGoal } from "./logic.js";

const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL      ?? "";
const EVENTS_URL = window.__EVENTS_URL  ?? "/api/events";
const ME         = window.__CURRENT_MEMBER ?? null;

// Only credit allowance/reward events from apps we trust to mint balances. source_app_id
// is set server-side from the publishing app's URL (a child can't spoof it), and the
// trusted publisher (chores) requires the adult role to emit allowance.earned via
// publish_acls. reward.earned remains supported for older Chores bundles.
const TRUSTED_REWARD_SOURCES = ["chore-tracker"];

let members          = [];
let banks            = [];       // piggy banks relevant to current user
let goals            = [];       // active savings goals relevant to current user
let transactions     = {};       // bankId → last 10 rows
let viewMemberId     = null;     // admin: which member detail is open
let processingEvents = false;

// ─── DB ───────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  return res.json();
}

async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

// ─── Load ─────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",   role: "adult" },
      { id: "demo-2", name: "Jordan", role: "child" },
      { id: "demo-3", name: "Casey",  role: "child" },
    ];
    return;
  }
  try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; }
  catch { members = []; }
}

async function loadBanks() {
  if (!ME) return;
  if (isAdult(ME)) {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__piggy_banks ORDER BY member_id, type`);
    banks = rows ?? [];
  } else {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__piggy_banks WHERE member_id = ? ORDER BY type`, [ME.id]);
    banks = rows ?? [];
  }
  // Balance is DERIVED: retention rollup + SUM of the live transaction tail,
  // both aggregated in SQL. The stored piggy_banks.balance column (migrations
  // ≤004) is no longer read or written — it could silently diverge from the
  // ledger when the old insert+update pair failed in between, and it blocked
  // retention on transactions (expiring rows would not have moved it, but
  // nothing reconciled it either). The hub retention runner folds expiring
  // transactions into bank_rollups inside the same transaction as their
  // delete, so this derivation is stable across expiry.
  const tails = new Map();
  const { rows: tailRows } = await db(`SELECT bank_id, COALESCE(SUM(amount), 0) AS tail FROM app_piggy_bank__transactions GROUP BY bank_id`);
  for (const row of tailRows ?? []) tails.set(row.bank_id, Number(row.tail ?? 0));
  const { rows: rollupRows } = await db(`SELECT bank_id, amount FROM app_piggy_bank__bank_rollups`);
  const rollups = new Map((rollupRows ?? []).map(r => [r.bank_id, Number(r.amount ?? 0)]));
  for (const bank of banks) bank.balance = (rollups.get(bank.id) ?? 0) + (tails.get(bank.id) ?? 0);
}

async function loadGoals() {
  if (!ME) return;
  if (isAdult(ME)) {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__savings_goals WHERE status = 'active' ORDER BY created_at`);
    goals = rows ?? [];
  } else {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__savings_goals WHERE member_id = ? AND status = 'active' ORDER BY created_at`, [ME.id]);
    goals = rows ?? [];
  }
}

async function loadTransactionsForBank(bankId) {
  const { rows } = await db(`SELECT * FROM app_piggy_bank__transactions WHERE bank_id = ? ORDER BY created_at DESC LIMIT 10`, [bankId]);
  transactions[bankId] = rows ?? [];
}

async function loadAllTransactions() {
  await Promise.all(banks.map(bank => loadTransactionsForBank(bank.id)));
}

// ─── Format helpers ───────────────────────────────────────────────────────
function mc(id) { return memberColor(id, members); }

// ─── Allowance event processing ───────────────────────────────────────────
async function processAllowanceEvents() {
  // Crediting writes to banks/transactions, which are adult-only (row policies).
  // Only an adult's client processes reward events; the source_event_id dedup means
  // a credit is applied exactly once, whenever an adult next opens the app.
  if (!ME || !isAdult(ME)) return;
  if (processingEvents) return;
  processingEvents = true;
  try {
    // Only fetch events newer than the most recent one we've already imported.
    const { rows: [lastRow] } = await db(
      `SELECT MAX(created_at) as last_at FROM app_piggy_bank__transactions WHERE source_event_id IS NOT NULL`
    );
    const since = lastRow?.last_at;
    const types = ["allowance.earned", "reward.earned"];
    const batches = await Promise.all(types.map(async type => {
      const url = `${EVENTS_URL}?type=${encodeURIComponent(type)}` +
        (since ? `&since=${encodeURIComponent(since)}` : "");
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return Array.isArray(data) ? data : (data.events ?? []);
    }));
    const events = batches.flat();
    await Promise.all(events.map(ev => processOneEvent(ev)));
  } catch {} finally { processingEvents = false; }
}

async function processOneEvent(ev) {
  // source_event_id on transactions is the correctness guard against duplicates
  // (protects if the since cutoff is inclusive, or two tabs race)
  const { rows: seen } = await db(
    `SELECT 1 FROM app_piggy_bank__transactions WHERE source_event_id = ?`, [ev.id]
  );
  if (seen.length) return;

  // Ignore reward events from any app we don't trust to mint allowance.
  if (!TRUSTED_REWARD_SOURCES.includes(ev.source_app_id)) return;

  const p = ev.payload ?? {};
  if (!p.member_id) return;

  const now  = new Date().toISOString();
  const note = p.note || p.source_label || "Reward";
  const src  = ev.source_app_id === "chore-tracker" ? "chores" : (ev.source_app_id ?? "unknown");

  // Deposit money
  if ((p.cents_earned ?? 0) > 0 && p.reward_type !== "screen_time") {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__piggy_banks WHERE member_id = ? AND type = 'money'`, [p.member_id]);
    if (rows.length) {
      const bank = rows[0];
      // Single statement; the partial UNIQUE index on source_event_id is the
      // dedupe. The pre-read above only narrows the common case — two adult
      // tabs can both find no row, and the second INSERT then fails here
      // instead of double-crediting (the old shape also applied a separate
      // balance UPDATE, which the loser still executed).
      try {
        await db(
          `INSERT INTO app_piggy_bank__transactions (id, bank_id, member_id, actor_id, amount, note, source, created_at, source_event_id)
           VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
          [crypto.randomUUID(), bank.id, p.member_id, src, p.cents_earned, note, src, now, ev.id]
        );
      } catch { /* concurrent tab already credited this event */ }
    }
  }

  // Deposit screen time
  if ((p.minutes_earned ?? 0) > 0 && p.reward_type !== "money") {
    const { rows } = await db(`SELECT * FROM app_piggy_bank__piggy_banks WHERE member_id = ? AND type = 'screen_time'`, [p.member_id]);
    if (rows.length) {
      const bank = rows[0];
      try {
        await db(
          `INSERT INTO app_piggy_bank__transactions (id, bank_id, member_id, actor_id, amount, note, source, created_at, source_event_id)
           VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
          [crypto.randomUUID(), bank.id, p.member_id, src, p.minutes_earned, note, src, now, ev.id]
        );
      } catch { /* concurrent tab already credited this event */ }
    }
  }
}

// ─── Admin actions ────────────────────────────────────────────────────────
async function createBank(memberId, type) {
  if (!isAdult(ME)) return;
  const name = type === "money" ? "Money" : "Screen Time";
  const id   = crypto.randomUUID();
  const now  = new Date().toISOString();
  await db(`INSERT INTO app_piggy_bank__piggy_banks (id, member_id, name, type, balance, created_at) VALUES (?, ?, ?, ?, 0, ?)`, [id, memberId, name, type, now]);
  await loadBanks();
  transactions[id] = [];
  render();
}

async function deleteBank(bankId) {
  if (!isAdult(ME)) return;
  if (!await hubConfirm({ message: "Delete this bank?", description: "All transaction history will be permanently removed.", confirmLabel: "Delete bank", destructive: true })) return;
  // One statement: manifest delete_cascades removes the bank's transactions in
  // the same transactional batch. Two separate calls could leave a bank whose
  // ledger had already been deleted but whose balance row survived.
  await db(`DELETE FROM app_piggy_bank__piggy_banks WHERE id = ?`, [bankId]);
  delete transactions[bankId];
  await loadBanks();
  render();
}

async function recordTransaction(bankId, amount, note, source = "manual") {
  const bank = banks.find(b => b.id === bankId);
  if (!bank || !ME) return;
  if (!isAdult(ME)) return;  // balances are adult-controlled (enforced server-side too)
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();

  // Optimistic update: reflect balance change and close modal immediately
  bank.balance += amount;
  const optimisticTx = { id, bank_id: bankId, member_id: bank.member_id, actor_id: ME.id, amount, note, source, created_at: now };
  transactions[bankId] = [optimisticTx, ...(transactions[bankId] ?? [])].slice(0, 10);
  closeModal();
  render();

  // Persist to DB, then sync tx list to match server order/content
  // One INSERT — the balance is derived from the ledger (see loadBanks), so
  // there is no second statement to fail separately and diverge.
  await db(`INSERT INTO app_piggy_bank__transactions (id, bank_id, member_id, actor_id, amount, note, source, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
    [id, bankId, bank.member_id, ME.id, amount, note, source, now]);
  await loadTransactionsForBank(bankId);
  render();
}

async function createGoal(memberId, bankType, title, target) {
  if (!isAdult(ME) || !title || target <= 0) return;
  await db(
    `INSERT INTO app_piggy_bank__savings_goals (id, member_id, bank_type, title, target, status, created_at)
     VALUES (?, ?, ?, ?, ?, 'active', ?)`,
    [crypto.randomUUID(), memberId, bankType, title, target, new Date().toISOString()]
  );
  await loadGoals();
  closeModal();
  render();
}

async function archiveGoal(goalId) {
  if (!isAdult(ME)) return;
  await db(
    `UPDATE app_piggy_bank__savings_goals SET status = 'archived' WHERE id = ?`,
    [goalId]
  );
  goals = goals.filter(g => g.id !== goalId);
  render();
}

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function openTransactionModal(bank, isDeposit) {
  const member  = members.find(m => m.id === bank.member_id);
  const isMoney = bank.type === "money";
  const label   = isDeposit ? "Add" : "Subtract";
  const unit    = isMoney ? "dollars" : "minutes";

  openModal(`
    <h3>${isDeposit ? "➕" : "➖"} ${label} ${isMoney ? "Money" : "Screen Time"}</h3>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:16px">
      For <strong>${esc(member?.name ?? "?")}</strong> · Current balance: <strong>${fmtBalance(bank)}</strong>
    </div>
    <div class="form-group">
      <label>Amount (${unit})</label>
      <div class="input-prefix">
        ${isMoney ? `<span class="prefix">$</span>` : ""}
        <input id="tx-amount" type="number" min="0" step="${isMoney ? "0.01" : "1"}" placeholder="${isMoney ? "0.00" : "30"}" data-autofocus />
      </div>
      ${!isMoney ? `<div class="amount-hint">Enter minutes (e.g. 30 = 30 min, 90 = 1h 30m)</div>` : ""}
    </div>
    <div class="form-group">
      <label>Note <span style="font-weight:400;text-transform:none;color:var(--muted)">(optional)</span></label>
      <input id="tx-note" type="text" placeholder="${isDeposit ? "Birthday gift, bonus…" : "Spent on snack…"}" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ${isDeposit ? "btn-gold" : "btn-danger"}" data-bank-id="${esc(bank.id)}" data-bank-type="${esc(bank.type)}" onclick="submitTx(this.dataset.bankId, this.dataset.bankType, ${isDeposit})">
        ${isDeposit ? "Add" : "Subtract"}
      </button>
    </div>`);
}

function openGoalModal(bank) {
  const member  = members.find(m => m.id === bank.member_id);
  const isMoney = bank.type === "money";
  openModal(`
    <h3>🎯 Add Goal</h3>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:16px">
      For <strong>${esc(member?.name ?? "?")}</strong> · ${isMoney ? "Money" : "Screen Time"}
    </div>
    <div class="form-group">
      <label>Goal</label>
      <input id="goal-title" type="text" placeholder="${isMoney ? "New bike" : "Saturday game time"}" data-autofocus />
    </div>
    <div class="form-group">
      <label>Target (${isMoney ? "dollars" : "minutes"})</label>
      <div class="input-prefix">
        ${isMoney ? `<span class="prefix">$</span>` : ""}
        <input id="goal-target" type="number" min="1" step="${isMoney ? "0.01" : "1"}" placeholder="${isMoney ? "25.00" : "60"}" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-bank-id="${esc(bank.id)}" onclick="submitGoal(this.dataset.bankId)">Save goal</button>
    </div>`);
}

window.submitTx = function(bankId, type, isDeposit) {
  const rawVal = parseFloat(document.getElementById("tx-amount").value);
  if (!rawVal || rawVal <= 0) { document.getElementById("tx-amount").focus(); return; }
  const amount = type === "money"
    ? Math.round(rawVal * 100) * (isDeposit ? 1 : -1)
    : Math.round(rawVal) * (isDeposit ? 1 : -1);
  const note = document.getElementById("tx-note").value.trim();
  recordTransaction(bankId, amount, note);
};

window.submitGoal = function(bankId) {
  const bank = banks.find(b => b.id === bankId);
  if (!bank) return;
  const title = document.getElementById("goal-title").value.trim();
  const rawTarget = parseFloat(document.getElementById("goal-target").value);
  if (!title) { document.getElementById("goal-title").focus(); return; }
  if (!rawTarget || rawTarget <= 0) { document.getElementById("goal-target").focus(); return; }
  const target = bank.type === "money" ? Math.round(rawTarget * 100) : Math.round(rawTarget);
  createGoal(bank.member_id, bank.type, title, target);
};

window.closeModal = closeModal;

// ─── Render ───────────────────────────────────────────────────────────────
function renderBankCard(bank, canManage) {
  const isMoney = bank.type === "money";
  const txRows  = (transactions[bank.id] ?? []);
  const bankGoals = goals.filter(g => g.member_id === bank.member_id && g.bank_type === bank.type);
  const goalHtml = bankGoals.length === 0
    ? canManage
      ? `<div class="goal-list"><button class="btn btn-ghost btn-sm" data-bank-id="${esc(bank.id)}" onclick="openGoal(this.dataset.bankId)">+ Add goal</button></div>`
      : ""
    : `<div class="goal-list">${bankGoals.map(goal => {
        const progress = goalProgress(goal, bank);
        const remaining = remainingForGoal(goal, bank);
        return `
          <div class="goal-card">
            <div class="goal-top">
              <span>${esc(goal.title)}</span>
              <span>${progress}%</span>
            </div>
            <div class="goal-bar"><div class="goal-fill" style="width:${progress}%"></div></div>
            <div class="goal-meta">
              <span>${remaining === 0 ? "Ready!" : `${fmtAmount(remaining, bank.type).replace("+", "")} to go`}</span>
              <span>Target ${bank.type === "money" ? fmtMoney(goal.target) : fmtTime(goal.target)}</span>
            </div>
            ${canManage ? `<div class="goal-actions"><button class="btn btn-ghost btn-sm" data-goal-id="${esc(goal.id)}" onclick="archiveGoal(this.dataset.goalId)">Archive</button></div>` : ""}
          </div>`;
      }).join("")}${canManage ? `<button class="btn btn-ghost btn-sm" data-bank-id="${esc(bank.id)}" onclick="openGoal(this.dataset.bankId)">+ Add another goal</button>` : ""}</div>`;

  const txHtml = txRows.length === 0
    ? `<div style="padding:10px 18px;font-size:.82rem;color:var(--muted);font-style:italic">No transactions yet.</div>`
    : txRows.map(tx => {
        const actor   = members.find(m => m.id === tx.actor_id);
        const actorName = tx.source === "chores" ? "Chores" : tx.source === "automation" ? "Automation" : (actor?.name ?? "Admin");
        const safeSource = (tx.source ?? "manual").replace(/[^a-zA-Z0-9_-]/g, "");
        return `
          <div class="tx-row">
            <div class="tx-amount ${tx.amount >= 0 ? "positive" : "negative"}">
              ${fmtAmount(tx.amount, bank.type)}
            </div>
            <div class="tx-detail">
              <div class="tx-note ${!tx.note ? "muted" : ""}">${tx.note ? esc(tx.note) : "No note"}</div>
              <div class="tx-meta">
                ${esc(actorName)} · ${fmtDate(tx.created_at)}
                <span class="tx-source ${safeSource}">${esc(tx.source ?? "manual")}</span>
              </div>
            </div>
          </div>`;
      }).join("");

  return `
    <div class="bank-card">
      <div class="bank-card-header">
        <div class="bank-type-label">${isMoney ? "💰 Money" : "📱 Screen Time"}</div>
        <div class="bank-balance ${bank.type}">${fmtBalance(bank)}</div>
      </div>
      ${goalHtml}
      ${canManage ? `
      <div class="bank-admin-actions">
        <button class="btn btn-gold btn-sm" data-bank-id="${esc(bank.id)}" onclick="openTx(this.dataset.bankId, true)">+ Add</button>
        <button class="btn btn-ghost btn-sm" data-bank-id="${esc(bank.id)}" onclick="openTx(this.dataset.bankId, false)">− Subtract</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" data-bank-id="${esc(bank.id)}" onclick="deleteBank(this.dataset.bankId)">Delete bank</button>
      </div>` : ""}
      <div class="tx-list">${txHtml}</div>
    </div>`;
}

function renderMemberDetail(memberId) {
  const member    = members.find(m => m.id === memberId);
  const myBanks   = banks.filter(b => b.member_id === memberId);
  const moneyBank = myBanks.find(b => b.type === "money");
  const timeBank  = myBanks.find(b => b.type === "screen_time");
  const canManage = isAdult(ME);
  const col       = mc(memberId);

  const bankCards = [
    moneyBank ? renderBankCard(moneyBank, canManage) : canManage
      ? `<div class="create-bank-row">No money bank yet.<br/><button class="btn btn-gold btn-sm" data-member-id="${esc(memberId)}" onclick="createBank(this.dataset.memberId,'money')">+ Create Money Bank</button></div>` : "",
    timeBank  ? renderBankCard(timeBank,  canManage) : canManage
      ? `<div class="create-bank-row">No screen time bank yet.<br/><button class="btn btn-blue btn-sm" data-member-id="${esc(memberId)}" onclick="createBank(this.dataset.memberId,'screen_time')">+ Create Screen Time Bank</button></div>` : "",
  ].filter(Boolean).join("");

  return `
    <div class="back-bar">
      ${isAdult(ME) ? `<button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>` : ""}
      <h2>
        <span class="avatar-sm" style="background:${col}">${initial(member?.name ?? "?")}</span>
        ${esc(member?.name ?? "?")}
      </h2>
    </div>
    ${bankCards || `<div class="empty">No banks yet.</div>`}`;
}

function renderAdminOverview() {
  const kids = members.filter(m => !isAdult(m));
  const adults = members.filter(m => isAdult(m) && banks.some(b => b.member_id === m.id));
  const showMembers = [...kids, ...adults];

  if (showMembers.length === 0) {
    return `<div class="empty">No family members found. Add members in the hub to get started.</div>`;
  }

  const cards = showMembers.map(m => {
    const mb   = banks.find(b => b.member_id === m.id && b.type === "money");
    const tb   = banks.find(b => b.member_id === m.id && b.type === "screen_time");
    const pills = [
      mb ? `<span class="bank-pill money">💰 ${fmtBalance(mb)}</span>` : `<span class="bank-pill empty">No money bank</span>`,
      tb ? `<span class="bank-pill screen_time">📱 ${fmtBalance(tb)}</span>` : `<span class="bank-pill empty">No screen time bank</span>`,
    ].join("");
    return `
      <div class="member-card" data-member-id="${esc(m.id)}" onclick="viewMember(this.dataset.memberId)">
        <div class="member-card-top">
          <div class="avatar" style="background:${mc(m.id)}">${initial(m.name)}</div>
          <div><div class="name">${esc(m.name)}</div><div class="role">${esc(m.role)}</div></div>
        </div>
        <div class="bank-pills">${pills}</div>
        <div class="hint">Tap to manage →</div>
      </div>`;
  }).join("");

  return `
    <div class="section-title">Family Banks</div>
    <div class="members-grid">${cards}</div>`;
}

function render() {
  if (!ME) { document.getElementById("root").innerHTML = `<div class="empty">Please log in.</div>`; return; }

  const meIsAdult = isAdult(ME);
  const syncing   = processingEvents ? `<span class="processing-badge">syncing…</span>` : "";

  document.getElementById("root").innerHTML = `
    <header>
      <div><h1>🐷 Piggy Bank${syncing}</h1><div class="sub">Savings &amp; screen time</div></div>
    </header>
    <div id="main-content"></div>`;

  const main = document.getElementById("main-content");
  if (meIsAdult && viewMemberId) {
    main.innerHTML = renderMemberDetail(viewMemberId);
  } else if (meIsAdult) {
    main.innerHTML = renderAdminOverview();
  } else {
    main.innerHTML = renderMemberDetail(ME.id);
  }
}

window.viewMember  = id => { viewMemberId = id; render(); };
window.goBack      = ()  => { viewMemberId = null; render(); };
window.openTx      = (bankId, isDeposit) => { const bank = banks.find(b => b.id === bankId); if (bank) openTransactionModal(bank, isDeposit); };
window.openGoal    = bankId => { const bank = banks.find(b => b.id === bankId); if (bank) openGoalModal(bank); };
window.archiveGoal = archiveGoal;
window.deleteBank  = deleteBank;
window.createBank  = async (memberId, type) => { await createBank(memberId, type); };

// ─── Init ─────────────────────────────────────────────────────────────────
(async () => {
  await loadMembers();
  if (DB) {
    await initDb();
    await loadBanks();
    await loadGoals();
    await loadAllTransactions();
    // Process any pending chore allowance events
    processAllowanceEvents().then(async () => {
      await loadBanks();
      await loadGoals();
      await loadAllTransactions();
      render();
    }).catch(() => {});
  }
  render();
})();
</script>
</body>
</html>
