<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piggy Bank Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: #fff;
      color: #111827;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 8px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
    }
    .header-title { font-weight: 600; font-size: 13px; }
    .header-count { font-size: 11px; color: #6b7280; }

    .bank-list { flex: 1; overflow-y: auto; }

    .member-section { border-bottom: 1px solid #f3f4f6; }
    .member-section:last-child { border-bottom: none; }

    .member-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
    }

    .member-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .member-name { flex: 1; font-size: 12.5px; font-weight: 500; }

    .balances { display: flex; gap: 6px; }

    .balance-chip {
      font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px;
    }
    .chip-money       { background: #fef3c7; color: #92400e; }
    .chip-screen_time { background: #dbeafe; color: #1e40af; }

    .footer {
      padding: 6px 14px; border-top: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: #f9fafb;
    }
    .open-link { font-size: 11px; font-weight: 600; color: #111827; text-decoration: none; }
    .open-link:hover { text-decoration: underline; }

    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #9ca3af; font-size: 12px; gap: 6px;
    }
  </style>
</head>
<body>
<script type="module">
const DB      = window.__DB_URL      ?? "";
const CONTEXT = window.__CONTEXT_URL ?? "";
const APP_ID  = "piggy-bank";

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

function fmtMoney(cents) {
  const neg = cents < 0;
  return `${neg ? "-" : ""}$${(Math.abs(cents) / 100).toFixed(2)}`;
}

function fmtTime(minutes) {
  if (Math.abs(minutes) < 60) return `${minutes}m`;
  const h = Math.floor(Math.abs(minutes) / 60);
  const m = Math.abs(minutes) % 60;
  return `${minutes < 0 ? "-" : ""}${h}h${m > 0 ? `${m}m` : ""}`;
}

const COLORS = ["#7c3aed","#0891b2","#059669","#dc2626","#d97706","#4f46e5","#db2777"];
function memberColor(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}

function initial(name) {
  return (name ?? "?").trim()[0]?.toUpperCase() ?? "?";
}

async function loadMembers() {
  if (!CONTEXT) return {};
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const data = await res.json();
    const list = data["family.members"] ?? [];
    return Object.fromEntries(list.map(m => [m.id, m]));
  } catch { return {}; }
}

async function load() {
  const [members, { rows: banks }] = await Promise.all([
    loadMembers(),
    dbq(`SELECT member_id, type, balance FROM piggy_banks ORDER BY member_id, type`),
  ]);

  // Group banks by member
  const byMember = new Map();
  for (const b of banks) {
    if (!byMember.has(b.member_id)) byMember.set(b.member_id, []);
    byMember.get(b.member_id).push(b);
  }

  const header = `
    <div class="header">
      <span class="header-title">Piggy Banks</span>
      <span class="header-count">${byMember.size} member${byMember.size !== 1 ? "s" : ""}</span>
    </div>`;

  let body;
  if (byMember.size === 0) {
    body = `<div class="empty">
      <span>No banks created yet</span>
      <a href="/open/${APP_ID}" onclick="window.__HUB_OPEN && (event.preventDefault(), window.__HUB_OPEN('${APP_ID}'))" style="color:#111827;font-weight:600;font-size:11px">Open Piggy Bank →</a>
    </div>`;
  } else {
    const sections = [...byMember.entries()].map(([memberId, mBanks]) => {
      const member = members[memberId];
      const name   = member?.name ?? "Member";
      const color  = memberColor(memberId);
      const chips  = mBanks.map(b => {
        const label = b.type === "money" ? fmtMoney(b.balance) : fmtTime(b.balance);
        return `<span class="balance-chip chip-${esc(b.type)}">${label}</span>`;
      }).join("");
      return `<div class="member-section">
        <div class="member-row">
          <div class="member-avatar" style="background:${color}">${esc(initial(name))}</div>
          <span class="member-name">${esc(name)}</span>
          <div class="balances">${chips}</div>
        </div>
      </div>`;
    });
    body = `<div class="bank-list">${sections.join("")}</div>`;
  }

  const footer = `
    <div class="footer">
      <a class="open-link" href="/open/${APP_ID}" onclick="window.__HUB_OPEN && (event.preventDefault(), window.__HUB_OPEN('${APP_ID}'))">Manage banks →</a>
    </div>`;

  document.body.innerHTML = header + body + footer;
}

load().catch(() => {
  document.body.innerHTML = `<div class="empty"><a href="/open/${APP_ID}" style="color:#111827;font-weight:600">Open Piggy Bank →</a></div>`;
});
</script>
</body>
</html>
